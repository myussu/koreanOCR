<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Maru: YouTube captions</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.45 system-ui, "Segoe UI", sans-serif; width: 340px; margin: 0; padding: 14px 16px 16px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    #video { margin: 0 0 6px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, currentColor 8%, transparent); }
    #video.ok { background: color-mix(in srgb, #2e9e5b 22%, transparent); }
    #link { margin: 0 0 10px; color: #c0392b; min-height: 0; }
    #link:empty { display: none; }
    label { display: block; margin: 10px 0 0; }
    label span { display: block; margin-bottom: 3px; }
    input[type="password"], input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 5px 7px; font: inherit; }
    .switch { display: flex; gap: 8px; align-items: flex-start; }
    .switch input { margin-top: 2px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    button { font: inherit; padding: 5px 12px; }
    #result { flex: 1; }
    small { display: block; margin-top: 12px; opacity: 0.75; overflow-wrap: anywhere; }
    code { font-size: 11.5px; }
  </style>
</head>
<body>
  <h1>Maru: YouTube captions</h1>
  <p id="video" role="status">…</p>
  <p id="link" role="alert"></p>

  <label><span>Code from Maru's settings</span><input id="token" type="password" autocomplete="off" spellcheck="false"></label>
  <label><span>Port (Maru's default is 18098)</span><input id="port" type="number" min="1024" max="65535" step="1"></label>
  <label class="switch"><input id="asr" type="checkbox"><span>Use auto-generated Korean captions when the author uploaded none. They contain mistakes; translated captions are never used.</span></label>

  <div class="row"><button id="save" type="button">Save</button><button id="test" type="button">Test the connection</button><span id="result" role="status"></span></div>

  <small>Lines are sent only to Maru on this PC (127.0.0.1) and nowhere else. This extension's address, if you want Maru to accept only it: <code id="origin"></code></small>

  <script src="captions-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
