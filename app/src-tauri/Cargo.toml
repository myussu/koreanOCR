[package]
name = "maru-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
description = "Maru overlay: select Korean (or English) anywhere on screen and read it with a word-by-word breakdown"
default-run = "maru-app"

# Standalone workspace: it needs the platform webview, which the headless crates must not require.
[workspace]

[dependencies]
maru-core = { path = "../../crates/maru-core" }
maru-engine = { path = "../../crates/maru-engine" }
maru-llm = { path = "../../crates/maru-llm" }
maru-tts = { path = "../../crates/maru-tts" }
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2"

# Lower GPU/CPU cost for the always-on-top overlay in release builds.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
