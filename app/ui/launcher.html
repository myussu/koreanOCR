<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maru controls</title><link rel="stylesheet" href="launcher.css"><link rel="stylesheet" href="reading.css"></head>
<body><main id="controls"><button id="maru" aria-label="Open Maru controls; drag to move" aria-expanded="false"><span>마</span><i id="dot"></i></button>
<section id="menu" hidden aria-label="Maru quick controls"><header><strong>Maru</strong><button id="collapse" aria-label="Collapse controls">×</button></header>
<p id="state" role="status"></p><small id="model"></small><small id="ocr"></small><small id="queue"></small><small id="snapshot"></small><p id="preparation" role="status"></p><small id="model-message" role="status"></small><div id="actions"></div><p id="error" role="alert"></p>
<footer><button id="hide">Hide button</button><button id="quit">Quit Maru</button></footer><small id="tip">Drag 마 to move · Ctrl+Alt+M shows / hides</small></section></main><script type="module" src="launcher.js"></script></body></html>
