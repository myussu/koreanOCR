<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maru action wheel</title><link rel="stylesheet" href="wheel.css"></head>
<body><main id="wheel" aria-label="Maru quick actions">
<div id="actions" role="group" aria-label="Reading actions"></div>
<section id="center"><strong>Maru</strong><small id="page"></small><p id="selected" aria-live="polite"></p><small id="area"></small><div id="vram"></div><button id="close" type="button" aria-label="Close controls and return to game">Close · Esc</button></section>
<p id="error" role="alert" hidden></p><small id="keys">1–8 choose · Arrows select · Enter opens</small>
</main><script type="module" src="wheel.js"></script></body></html>
