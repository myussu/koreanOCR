<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maru</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { overflow: auto; background: var(--bg); height: 100%; }
    body { padding: 0; }
    nav { display: flex; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
    nav button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 8px; font-size: 14px; color: var(--muted); }
    nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    main { padding: 18px 22px 40px; max-width: 760px; margin: 0 auto; }
    .big { font-family: var(--ko); font-size: 34px; text-align: center; margin: 26px 0 6px; }
    .center { text-align: center; color: var(--muted); }
    .ctx { margin: 14px auto; padding: 10px 14px; border-radius: 10px; background: var(--chip); font-family: var(--ko); font-size: 17px; max-width: 560px; }
    .ctx small { display: block; font-family: var(--ui); font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .rate { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .rate button { min-width: 110px; padding: 9px 14px; font-size: 13px; }
    .hist { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .hist .ko { font-family: var(--ko); font-size: 17px; }
    .hist .en { color: var(--muted); margin-top: 2px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13.5px; }
    td:first-child { color: var(--muted); width: 130px; }
    kbd { background: var(--chip); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
    .stat { display: inline-block; margin-right: 22px; } .stat b { font-size: 22px; display: block; }
  </style>
</head>
<body>
  <nav id="tabs">
    <button data-tab="review">Review</button>
    <button data-tab="history">History</button>
    <button data-tab="status">Status</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="view"></main>
  <script type="module" src="hub.js"></script>
</body>
</html>
