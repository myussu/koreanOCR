[package]
name = "maru-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Orchestration: capture → analyse → translate → learn, streamed as events"

[features]
default = ["paddle"]
# Build the PP-OCR engine into the bootstrap (ONNX Runtime comes from the platform dependency below).
paddle = []
directml = ["maru-ocr/directml"]
cuda = ["maru-ocr/cuda"]

[dependencies]
maru-core.workspace = true
maru-lang.workspace = true
maru-dict.workspace = true
maru-srs.workspace = true
maru-llm.workspace = true
maru-ocr.workspace = true
maru-platform.workspace = true
maru-tts.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
rusqlite.workspace = true

[dev-dependencies]
maru-llm = { workspace = true, features = ["testing"] }
# Only the opt-in real-Anki test's pass-through (tests/real_anki.rs).
reqwest.workspace = true

# ONNX Runtime: bundled on Windows (the supported platform), located at run time elsewhere.
[target.'cfg(windows)'.dependencies]
# DirectML (`[ocr] device = "directml:0"`, PP-OCR on any DirectX 12 GPU) is the `directml` feature above and is not
# on by default: with it the ONNX Runtime bindings (ort-sys 2.0.0-rc.13) copy DirectML.dll during the build, and that
# step fails under the build-folder layout of Rust 1.100 and later. Build with `--features directml` on an older
# toolchain, or once the bindings are fixed. Without it the setting falls back to the CPU.
maru-ocr = { workspace = true, features = ["ort-download"] }

[target.'cfg(not(windows))'.dependencies]
maru-ocr = { workspace = true, features = ["ort-dynamic"] }
