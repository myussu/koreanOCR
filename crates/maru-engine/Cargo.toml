[package]
name = "maru-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Orchestration: capture → analyse → translate → learn, streamed as events"

[features]
default = ["paddle"]
paddle = ["maru-ocr/paddle"]

[dependencies]
maru-core.workspace = true
maru-lang.workspace = true
maru-dict.workspace = true
maru-srs.workspace = true
maru-llm.workspace = true
maru-ocr.workspace = true
maru-platform.workspace = true
tokio.workspace = true
tokio-util.workspace = true
lru.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true

[dev-dependencies]
maru-llm = { workspace = true, features = ["testing"] }
