[package]
name = "maru-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Local LLM client (llama.cpp server): streaming, prompts and process supervision"

[features]
testing = []

[dependencies]
maru-core.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Windows: a job object makes the OS end every llama-server when Maru dies, however it dies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
