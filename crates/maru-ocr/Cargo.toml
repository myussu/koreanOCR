[package]
name = "maru-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen-text recognition: PP-OCR via ONNX Runtime with word-level boxes"

[features]
# No default: pick exactly one way of getting ONNX Runtime (see below). Depending crates do this
# per platform, so `maru-ocr` itself stays buildable without any native dependency.
default = []
# PP-OCR through ONNX Runtime (oar-ocr). Needs one of the two features below to link.
paddle = ["dep:oar-ocr"]
# Find ONNX Runtime at run time via ORT_DYLIB_PATH / the library search path.
# Used on dev machines and CI. (`ort` ships no DLL in this mode.)
ort-dynamic = ["paddle", "dep:ort"]
# Download, link and copy ONNX Runtime next to the executable at build time (Windows releases).
ort-download = ["paddle", "oar-ocr?/download-binaries"]
# Optional GPU execution providers (need the matching runtime installed).
directml = ["oar-ocr?/directml"]
cuda = ["oar-ocr?/cuda"]

[dependencies]
maru-core.workspace = true
image.workspace = true
thiserror.workspace = true
tracing.workspace = true
oar-ocr = { version = "0.10", default-features = false, features = ["simd"], optional = true }
# Only used to select dynamic loading when `ort-download` is off.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"], optional = true }

[dev-dependencies]
imageproc = { version = "0.27", default-features = false }
ab_glyph = "0.2"
