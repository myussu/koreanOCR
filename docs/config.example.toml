# Maru configuration. Every setting is optional; delete what you do not need.
# Location: %APPDATA%\maru\Maru\config\config.toml  (run `maru config path` to see yours)

# Run lighter beside a game (also: set the environment variable MARU_LITE=1 for one run).
# It turns the OCR reading model off, uses one model slot and a smaller context, and swaps in the
# smaller translation model below (about 2.5 GB less memory; the first start downloads it).
lite = false

[lite_profile]
hf_repo  = "unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL"   # "" keeps your [llm] model
ctx_size = 3072
parallel = 1

[hotkeys]
# Every action takes several keys, separated by "|". Games often use Ctrl, Shift and Alt, so add a
# plain key as an alternative, e.g. translate = "Ctrl+Alt+T | F6". Caution: a key registered here
# is taken away from EVERY program while Maru runs (F6 focuses the address bar in browsers, F5/F9
# are quick save/load in many games). Pause, ScrollLock, Insert and the numpad (Numpad5, ...) are
# rarely used; F6/F7/F8 are a reasonable choice if your games do not use them.
translate  = "Ctrl+Alt+T"       # translate the selection (or the text under the cursor)
region     = "Ctrl+Alt+R"       # drag a rectangle anywhere and translate what is inside
hover      = "Ctrl+Alt+H"       # toggle hover mode: rest the pointer on a word
continuous = "Ctrl+Alt+C"       # toggle live mode for subtitles / dialogue boxes (on the last area)
continuous_area = "Ctrl+Alt+Shift+C"  # choose a different area for live mode, and start it there
scan       = "Ctrl+Alt+S"       # label every Korean text on the screen (game menus); press again to rescan
speak      = "Ctrl+Alt+P"       # translate the selection and read it aloud (again while reading: stop). Needs [tts]
history    = "Ctrl+Alt+L"
dismiss    = "Ctrl+Alt+Escape"  # hides the panel and the screen labels (a bare Escape would be hijacked in every other app)

[llm]
# Let llama-server download and cache the model on first run (`maru setup llm` does it up front).
hf_repo = "unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL"
# ...or use a file you already have:
# model_path = "D:/models/gemma-4-12b-it-qat-UD-Q4_K_XL.gguf"
# ...or an already-running OpenAI-compatible server (LM Studio, a LAN box):
# endpoint = "http://127.0.0.1:1234/v1"
# Speculative decoding with a small draft model of the same family (faster, same quality):
# draft_model_path = "D:/models/gemma-4-1b-it-Q8_0.gguf"
parallel = 2          # translation and word meanings are generated at the same time
gpu_layers = "all"
context_lines = 4     # how many previous lines the model sees for continuity

[ocr]
backend = "auto"      # auto | paddle | windows
device  = "cpu"       # cpu | cuda:0 | directml:0  (GPU needs a build with that feature)
vision_reader = true  # pair PP-OCR with PaddleOCR-VL when installed (`maru setup ocr-vl`); ~2 GB VRAM

[learning]
gloss_mode = "fade_known"    # all | fade_known | hide_known
register = "polite"          # default politeness for English -> Korean
known_stability_days = 21    # a word counts as known once you can hold it this long
auto_save_after_lookups = 2  # queue a word for review on the 2nd lookup

[learning.anki]
# Anki is where words are reviewed. Needs Anki open with the AnkiConnect add-on (code 2055492159).
# Maru adds words from the deep dive (you pick or type the deck there), tags them, attaches the spoken
# word and sentence, and reads your progress back so words you hold for weeks fade. Your AnkiWeb
# login stays in Anki; Maru only asks Anki to sync.
enabled = false
deck = "Korean"             # suggested first; per program, a deck named after it is offered too
reverse = "subdeck"         # the English -> Korean card: subdeck (<deck>::Reverse) | same_deck | off
audio = true                # attach the spoken word and sentence (needs [tts])
sync_after_add = true       # ask Anki to sync with AnkiWeb a few seconds after adding
tags = ["maru"]             # on every card
auto_tags = true            # + level (topik-1), pos::verb, app::<program>, added::<year-month>
refresh_minutes = 30        # read card intervals back from Anki (0 = only at start-up)
# api_key = "..."           # only if you set one in AnkiConnect

[ui]
placement = "auto"    # auto | below | above
font_size_px = 18
show_romanization = true
show_pronunciation = true

[continuous]
# Live subtitles: translation only, drawn just above or below the original line (never over it). Word breakdowns come from the history.
interval_ms = 100     # how often the area is looked at
stable_ms = 150       # a picture this still is a finished line and is read at once (a fading line is read sooner)
linger_ms = 1500      # how long a translation stays after the original line is gone
context_lines = 4     # earlier lines the model sees, for pronouns and names
history_len = 300     # lines kept for review after a cutscene
# region = { x = 480.0, y = 900.0, w = 960.0, h = 120.0 }   # saved automatically if you set it from the tray

# Per-application behaviour. `exe` is the program's file name.
[[profile]]
name = "RPG"
exe = ["MyGame.exe"]
register = "casual"
hint = "dialogue from a fantasy role-playing game"
gloss_mode = "all"
[profile.glossary]
"이도현" = "Lee Do-hyun"

[tts]
# Hear Korean read aloud (for studying). `maru setup tts` installs the local voice and switches this on;
# `maru tts-eval` lets you listen to voices side by side first.
enabled = false
provider = "local"    # local = a voice on this PC (uses the GPU) | endpoint = a server
voice = "sohee"       # the Korean voice of the local Qwen3-TTS model
# A server on another PC (the same tts-server running there), or any OpenAI-style speech API, so this PC's GPU stays free:
# provider = "endpoint"
# endpoint = "http://192.168.1.20:8080"
# api_key = "sk-..."          # paid services only
# model = "tts-1"             # the name that service expects
# voice = "alloy"
# instructions = "Speak clearly and a little slowly"   # only models that support style instructions
cache_mb = 300        # spoken sentences are kept so hearing them again is free
run_in_lite = false   # keep the local voice off in game mode so the game has the GPU

# Per program: the deck and tags words met there should get (otherwise a deck named after the program is suggested).
# [[profile]]
# name = "Elden Ring"
