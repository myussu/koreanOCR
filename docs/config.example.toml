# Maru configuration. Every setting is optional; delete what you do not need.
# Location: %APPDATA%\maru\Maru\config\config.toml  (run `maru config path` to see yours)
# The app loads configured local GPU models on demand; opening Settings loads none.
# First translation, snapshot OCR, or speech use can wait for its model. CLI startup is unchanged.

# Run lighter beside a game (also: set the environment variable MARU_LITE=1 for one run).
# It turns the OCR reading model off, uses one model slot and a smaller context, and swaps in the
# smaller translation model below (about 2.5 GB less memory; the first start downloads it).
lite = false

[lite_profile]
hf_repo  = "unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL"   # "" keeps your [llm] model
ctx_size = 3072
parallel = 1

[hotkeys]
# Every action takes several keys, separated by "|". Games often use Ctrl, Shift and Alt, so add a
# plain key as an alternative, e.g. translate = "Ctrl+Alt+T | F6". Caution: a key registered here
# is taken away from EVERY program while Maru runs (F6 focuses the address bar in browsers, F5/F9
# are quick save/load in many games). Pause, ScrollLock, Insert and the numpad (Numpad5, ...) are
# rarely used; F6/F7/F8 are a reasonable choice if your games do not use them.
translate  = "Ctrl+Alt+T"       # translate the selection (or the text under the cursor)
region     = "Ctrl+Alt+R"       # drag a rectangle anywhere and translate what is inside
hover      = "Ctrl+Alt+H"       # toggle hover mode: rest the pointer on a word
continuous = "Ctrl+Alt+C"       # toggle live mode for subtitles / dialogue boxes (on the last area)
continuous_area = "Ctrl+Alt+Shift+C"  # choose a different area for live mode, and start it there
scan       = "Ctrl+Alt+S"       # label every Korean text on the screen (game menus); press again to rescan
# Floating Label screen toggles visibility; Refresh labels rescans, and Join words enables ordinary-click selection.
speak      = "Ctrl+Alt+P"       # translate the selection and read it aloud (again while reading: stop). Needs [tts]
history    = "Ctrl+Alt+L"
dismiss    = "Ctrl+Alt+Escape"  # hides panel, screen labels and reading feedback; existing OCR/translation can finish
# A bare Escape would be hijacked in every other app.
launcher   = "Ctrl+Alt+M"       # show / hide floating quick controls
reading_again = ""            # read the selected saved game area; assign a key in Settings → Shortcuts if wanted
wheel = "Ctrl+Alt+Q"          # focused controls at the pointer; mouse or arrows / Enter / Esc; empty disables
star = "Ctrl+Alt+B"           # star the live subtitle line on screen to study later (History → Starred); again un-stars

[llm]
# Let llama-server download and cache the model on first run (`maru setup llm` does it up front).
hf_repo = "unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL"
# ...or use a file you already have:
# model_path = "D:/models/gemma-4-12b-it-qat-UD-Q4_K_XL.gguf"
# ...or an already-running OpenAI-compatible server (LM Studio, a LAN box):
# endpoint = "http://127.0.0.1:1234/v1"
# model_name = "qwen3:8b"     # servers that choose by name (Ollama: exactly what `ollama list` shows)
# provider = "openai"         # default: OpenAI-compatible/NAS servers; "azure" = Azure OpenAI v1; "gemini" = Google Gemini
#                              # (endpoint = "https://generativelanguage.googleapis.com/v1beta/openai", model e.g. gemini-2.5-flash)
# api_key = "..."             # optional Bearer key; Azure and Gemini require theirs (stored locally in plain text)
# Named registrations are shared by both Settings server selectors. Selection copies endpoint/model/provider/key
# into that section's ordinary settings, then Save/restart applies the route. Library edits alone need no restart.
# servers = [
#   { name = "NAS", endpoint = "http://192.168.18.217:11434", model_name = "gemma4-12b-3060ti" },
#   { name = "Azure", endpoint = "https://YOUR-RESOURCE.openai.azure.com/openai/v1", model_name = "YOUR-DEPLOYMENT", provider = "azure", api_key = "YOUR-KEY" },
# ]
# Sent to such a server so "thinking" models (Qwen3, gpt-oss, ...) answer straight away instead of spending the
# token limit on reasoning. "none" = no thinking (the default); "" = send nothing, if the server rejects the field.
# reasoning_effort = "none"
# Ollama on another computer: keep the model loaded this many minutes after each request, load it when Maru opens
# and when live subtitles start, and unload it when they stop and when Maru quits. 0 = leave it to the server
# (Ollama unloads after 5 idle minutes, so the next line waits for the model to load again).
# server_keep_minutes = 15
# Speculative decoding with a small draft model of the same family (faster, same quality):
# draft_model_path = "D:/models/gemma-4-1b-it-Q8_0.gguf"
parallel = 2          # translation and word meanings are generated at the same time
gpu_layers = "all"
context_lines = 4     # how many previous lines the model sees for continuity
request_timeout_secs = 60 # chat: waiting for response headers or stalled output; active streams may take longer overall

[ocr]
backend = "auto"      # auto | paddle | windows
device  = "cpu"       # cpu | directml:0 (any DirectX 12 GPU; Windows builds include it) | cuda:0 (needs a CUDA build)
threads = 0           # CPU threads per PP-OCR read; 0 = every core. 4 leaves the rest to the game during live subtitles
vision_reader = true  # pair PP-OCR with PaddleOCR-VL when installed (`maru setup ocr-vl`); ~2 GB VRAM

[learning]
gloss_mode = "fade_known"    # all | fade_known | hide_known
register = "polite"          # default politeness for English -> Korean
known_stability_days = 21    # a word counts as known once you can hold it this long
auto_save_after_lookups = 2  # queue a word for review on the 2nd lookup

[learning.anki]
# Anki is where words are reviewed. Needs Anki open with the AnkiConnect add-on (code 2055492159).
# Maru adds words from the deep dive (you pick or type the deck there), tags them, attaches the spoken
# word and sentence, and reads your progress back so words you hold for weeks fade. Your AnkiWeb
# login stays in Anki; Maru only asks Anki to sync.
enabled = false
deck = "Korean"             # where word cards go unless you type another deck when adding
# sentence_deck = "Korean::Sentences"   # where sentence cards go; unset = the same deck as words
new_words_per_day = 3       # new word cards you study a day: only used to say when the cards you add would come up
new_sentences_per_day = 1   # (Anki's own limits are neither read nor changed; AnkiConnect cannot see a deck's overrides)
suggest_app_decks = false   # true also offers a deck per program (Korean::<program>); false: the program is only a tag
correct_forms = false       # true lets the card-meanings model correct a word's dictionary form (dialect, misread text);
                            # the sheet shows both. Off: it changes the prompt, and with it what a small model chooses
                            # (run 2: Gemma 12B corrected nothing; Claude Sonnet corrected 25 forms on 50 lines).
reverse = "subdeck"         # the English -> Korean card: subdeck (<deck>::Reverse) | same_deck | off
sentence_note_type = "Maru Korean Sentence"  # History → Make cards: the line as a one-card note (no reverse)
audio = true                # attach the spoken word and sentence (needs [tts])
sync_after_add = true       # ask Anki to sync with AnkiWeb a few seconds after adding
tags = ["maru"]             # on every card
auto_tags = true            # + level (topik-1), pos::verb, maru::<program>, added::<year-month>
refresh_minutes = 30        # read card intervals back from Anki (0 = only at start-up)
# Settings → Anki → Refresh progress also reads intervals explicitly, including missing/suspended cards.
# Local saved words remain separate from tracked Anki membership; unfinished note setup can be retried.
# api_key = "..."           # only if you set one in AnkiConnect

[ui]
placement = "auto"    # auto | below | above
font_size_px = 18
show_romanization = true
show_pronunciation = true
launcher = true               # show floating controls at startup; tray/shortcut can restore them
# Resource monitoring/recording controls are transient in the hub Resources tab, not config settings.

[continuous]
cpu_ocr = false       # experimental CPU PP-OCR for live only; skips the vision reader but leaves other features alone
max_in_flight = 0     # 0 = existing behavior, 1 = ordered translations, 2 = at most two active; pending lines are retained
filter_ocr_jitter = false # experimental: compare changed OCR readings with subtitle lettering; save and restart
# Live subtitles: translation only, drawn just above or below the original line (never over it). Word breakdowns come from the history.
interval_ms = 100     # how often the area is looked at
stable_ms = 150       # a picture this still is a finished line and is read at once (a fading line is read sooner)
linger_ms = 1500      # how long a translation stays after the original line is gone
context_lines = 4     # earlier lines the model sees, for pronouns and names
history_len = 300     # lines kept for review after a cutscene
# region = { x = 480.0, y = 900.0, w = 960.0, h = 120.0 }   # saved automatically if you set it from the tray

[continuous.translation]
# Local test models for live Korean-to-English. Save and restart; no downloads start in Settings.
# Floating controls: Prepare live session warms the saved live model/OCR explicitly; Release idle models unloads owned
# idle servers, which reload on next use. These actions add no setting and do not change the selections below.
model = "main"                # main | hy_mt2 | milmmt | hy_mt2_small | lfm; main preserves the existing task
# hy_mt2_path = "D:/models/Hy-MT2-7B-Q4_K_M.gguf"
# milmmt_path = "D:/models/MiLMMT-46-4B-v1.0.Q6_K.gguf"
# hy_mt2_small_path = "D:/models/Hy-MT2-1.8B-Q4_K_M.gguf"
# lfm_path = "D:/models/lfm2-1.2b-koen-mt-v8-rl-10k-merged-Q5_K_M.gguf"
# Small HY-MT2: 1024-token context; LFM2: 2048. Both use one slot and smaller batch buffers.
# These reduce translator VRAM, not OCR/speech memory. Keep context off for the initial quality trial.
device = "gpu"                # gpu | cpu; applies only to the optional live models
cpu_threads = 4               # 1..32; CPU disables device, KV and operator offload
dialogue_context = false      # experimental own-answer history; meaning regressions occurred in tests
# Optional quality server for snapshots/deep dive while live is on. If set, text/context leave this PC.
# snapshot_endpoint = "http://192.168.18.217:11434"
snapshot_model_name = "maru"   # exact model name, e.g. from ollama list
# snapshot_provider = "openai" # or "azure" or "gemini"; independent of [llm] authentication
# When live lines go to a server (model = "main" with [llm] endpoint): a local model for a line the server fails or
# is slow to start (crashed or reloading Ollama, a cloud rate limit). The next lines skip the server for about 20 s.
# It loads when live subtitles start; its *_path above must be set. Unset = wait for the server as before.
# backup_model = "hy_mt2_small"
# backup_after_ms = 2500        # how long the server may take to start answering before the backup takes the line
# snapshot_api_key = "..."     # optional Bearer key; Azure resource key when snapshot_provider = "azure"
# No server: live translator + offline meanings, without loading local Gemma.
# Live off: snapshots return to the normal [llm] setup on demand.

# One model per task. "local" is the model this PC runs ([llm] hf_repo / model_path); any other name is a
# connection saved under [llm] servers. Maru writes this table into an older file the first time the new version
# starts (a copy of the file is kept beside it as config.toml.before-tasks-<date>.bak; `maru config migrate` does
# the same from the command line, `maru config tasks` prints it). Once it has a version, the [llm] endpoint /
# provider / api_key / model_name keys and [continuous.translation] snapshot_* above are no longer read.
[tasks]
version = 1

[tasks.live]                  # live subtitles
connection = "local"
model = ""                    # "" = the connection's own model; with "local": "" or main | hy_mt2 | milmmt | hy_mt2_small | lfm

[tasks.capture]               # snapshot, region, screen scan, deep dive (hover asks no model)
connection = "local"
model = ""
while_live = ""               # a saved connection to use instead while live subtitles are on; "" = the same one
while_live_model = ""

[tasks.card_meanings]         # Make cards: the meaning of each word in the line
connection = "local"          # asked first; then this PC's model; then the dictionary's first sense.
model = ""                    # This PC's model is never loaded for a card while live subtitles run: the sheet
                              # offers another connection now, or the same request once they stop.

[tasks.card_sentence]         # Make cards: the sentence card's translation
connection = ""               # "" = keep the translation the line already has
model = ""

[tasks.voice_reading]         # the voice while reading or playing
voice = ""                    # "" = the voice in [tts]

[tasks.voice_cards]           # the voice on Anki cards
voice = ""

# Per-application behaviour. `exe` is the program's file name.
[[profile]]
name = "RPG"
exe = ["MyGame.exe"]
register = "casual"
hint = "dialogue from a fantasy role-playing game"
gloss_mode = "all"
[profile.glossary]
"이도현" = "Lee Do-hyun"

[tts]
# Hear Korean read aloud (for studying). `maru setup tts` installs the local voice and switches this on;
# `maru tts-eval` lets you listen to voices side by side first.
enabled = false
provider = "local"    # local = a voice on this PC (uses the GPU) | endpoint = a server
voice = "sohee"       # the Korean voice of the local Qwen3-TTS model
# A server on another PC (the same tts-server running there), or any OpenAI-style speech API, so this PC's GPU stays free:
# provider = "endpoint"
# endpoint = "http://192.168.1.20:8080"
# api_key = "sk-..."          # paid services only
# model = "tts-1"             # the name that service expects
# voice = "alloy"
# instructions = "Speak clearly and a little slowly"   # only models that support style instructions
cache_mb = 300        # spoken sentences are kept so hearing them again is free
run_in_lite = false   # keep the local voice off in game mode so the game has the GPU

# Per program: the deck and tags words met there should get (otherwise a deck named after the program is suggested).
# [[profile]]
# name = "Elden Ring"
# exe = ["eldenring.exe"]
# anki_deck = "Korean::Games::Elden Ring"
# anki_tags = ["game"]
